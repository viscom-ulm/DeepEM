<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Overview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            gap: 20px;
            justify-content: space-around;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .box {
            background: #ccc;
            padding: 20px;
            text-align: center;
            flex: 1;
            border-radius: 10px;
            max-width: 30%;
        }
        .box img {
            width: 100%;
            border-radius: 5px;
        }
        .box h3 {
            margin: 10px 0;
        }
        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>Image to Value(s)</h2>
            <h3>Object Counting in Electron Microscopy</h3>
            <img src="static/images/explainable-virus-quantification/Teaser.png" alt="Image to Value">
            <a href="#" class="button">Get Started</a>
        </div>
        <div class="box">
            <h2>Image to Image</h2>
            <h3>Semantic Segmentation of Cellular Structures</h3>
            <img src="static/images/segmentation-of-cellular-structures/Teaser-ensemble.png" alt="Image to Image">
            <a href="#" class="button">Get Started</a>
        </div>
        <div class="box">
            <h2>2D to 3D</h2>
            <h3>Tomographic Reconstruction</h3>
            <img src="static/images/tomographic-reconstruction-stem/Teaser.gif" alt="2D to 3D">
            <a href="#" class="button">Get Started</a>
        </div>
    </div>
</body>
</html>
